
<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

    <h2>Edit Student Details</h2>

    <form method="POST"
          action="{{ url_for('update_student_form',
          student_id=student.id) }}">

        <label>Name:</label>
        <input type="text"
               name="name"
               value="{{ student.name }}"
               required>

        <br><br>

        <label>Email:</label>
        <input type="email"
               name="email"
               value="{{ student.email }}"
               required>

        <br><br>

        <label>Course:</label>
        <input type="text"
               name="course"
               value="{{ student.course }}"
               required>

        <br><br>

        <button type="submit">Update Student</button>

    </form>

    <br>

    <a href="{{ url_for('students') }}">Back</a>

</body>
</html>
